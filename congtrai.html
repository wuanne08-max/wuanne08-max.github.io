<style>
:root{
  --blue:#4da3ff;
  --bg:#f2f7ff;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(#eaf3ff,#f6fbff);
  color:var(--text);
}

.wrapper{
  max-width:420px;
  margin:0 auto;
  background:#fff;
  min-height:100vh;
}

/* HEADER */
.header{
  text-align:center;
  padding:40px 20px 20px;
}

.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.header h1{
  margin:16px 0 6px;
  font-size:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.verify{
  width:20px;
  height:20px;
}

.intro{
  font-size:15px;
  color:var(--blue);
  min-height:22px;
  font-weight:500;
}

/* SOCIAL */
.socials{
  display:flex;
  justify-content:center;
  gap:14px;
  margin:22px 0;
}

.social{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#1877F2;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  text-decoration:none;
}

/* SECTION */
.section{
  padding:20px;
}

.section h2{
  text-align:center;
  margin-bottom:16px;
}

/* SKILLS */
.skill{
  margin-bottom:14px;
}

.skill label{
  font-size:14px;
}

.bar{
  height:12px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin-top:6px;
}

.fill{
  height:100%;
  border-radius:999px;
}

.html{width:100%;background:#22c55e}
.lua{width:0%;background:#3b82f6}

/* FOOTER */
.footer{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  padding:20px;
}
.lover-card{
  background:#f9fbff;
  border-radius:18px;
  padding:16px;
  display:flex;
  gap:14px;
  align-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.lover-avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
}

.lover-info{
  flex:1;
}

.lover-name{
  font-weight:600;
  font-size:16px;
}

.lover-desc{
  font-size:13px;
  color:#6b7280;
  margin:4px 0 8px;
}

.lover-link{
  font-size:13px;
  color:#ec4899;
  text-decoration:none;
  font-weight:500;
}

</style>
