<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Snake Game Advanced</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
}

.game-box {
    text-align: center;
}

canvas {
    background: #111;
    border: 4px solid #00ffcc;
    border-radius: 10px;
}

.info {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    width: 400px;
}

button {
    background: #00ffcc;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #00cca3;
}
</style>
</head>
<body>

<div class="game-box">
    <h2>🐍 SNAKE GAME ADVANCED</h2>
    <canvas id="game" width="400" height="400"></canvas>

    <div class="info">
        <div>Score: <span id="score">0</span></div>
        <div>Speed: <span id="speed">5</span></div>
        <button onclick="resetGame()">Restart</button>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;
let score = 0;
let speed = 5;
let game;

let snake;
let food;
let goldenFood;
let direction;
let obstacles = [];

function init() {
    snake = [{ x: 9 * box, y: 9 * box }];
    direction = "RIGHT";
    score = 0;
    speed = 5;

    food = randomPosition();
    goldenFood = null;
    obstacles = generateObstacles();

    document.getElementById("score").innerText = score;
    document.getElementById("speed").innerText = speed;

    clearInterval(game);
    game = setInterval(draw, 150);
}

function randomPosition() {
    return {
        x: Math.floor(Math.random() * 19) * box,
        y: Math.floor(Math.random() * 19) * box
    };
}

function generateObstacles() {
    let obs = [];
    for (let i = 0; i < 5; i++) {
        obs.push(randomPosition());
    }
    return obs;
}

document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
    if (e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
    if (e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
    if (e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
});

function collision(head, array) {
    return array.some(part => part.x === head.x && part.y === head.y);
}

function draw() {
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw snake
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#00ffcc" : "#00bfa6";
        ctx.fillRect(part.x, part.y, box, box);
    });

    // Draw food
    ctx.fillStyle = "red";
    ctx.fillRect(food.x, food.y, box, box);

    // Golden food
    if (goldenFood) {
        ctx.fillStyle = "gold";
        ctx.fillRect(goldenFood.x, goldenFood.y, box, box);
    }

    // Obstacles
    ctx.fillStyle = "#555";
    obstacles.forEach(o => ctx.fillRect(o.x, o.y, box, box));

    let head = { ...snake[0] };

    if (direction === "UP") head.y -= box;
    if (direction === "DOWN") head.y += box;
    if (direction === "LEFT") head.x -= box;
    if (direction === "RIGHT") head.x += box;

    // Game over
    if (
        head.x < 0 || head.y < 0 ||
        head.x >= canvas.width || head.y >= canvas.height ||
        collision(head, snake) ||
        collision(head, obstacles)
    ) {
        clearInterval(game);
        alert("💀 Game Over!\nScore: " + score);
        return;
    }

    // Eat food
    if (head.x === food.x && head.y === food.y) {
        score++;
        food = randomPosition();

        if (score % 5 === 0) goldenFood = randomPosition();
        if (score % 4 === 0 && speed < 15) {
            speed++;
            clearInterval(game);
            game = setInterval(draw, 150 - speed * 5);
        }
    } else if (goldenFood && head.x === goldenFood.x && head.y === goldenFood.y) {
        score += 5;
        goldenFood = null;
        snake.push({});
        snake.push({});
    } else {
        snake.pop();
    }

    snake.unshift(head);

    document.getElementById("score").innerText = score;
    document.getElementById("speed").innerText = speed;
}

function resetGame() {
    init();
}

init();
</script>

</body>
</html>
